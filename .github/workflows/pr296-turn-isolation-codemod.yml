name: PR 296 turn isolation codemod

on:
  push:
    branches:
      - fix/eyevue-real-device-setup-audio-vision
    paths:
      - .github/workflows/pr296-turn-isolation-codemod.yml

permissions:
  contents: write

jobs:
  patch-current-turn-attachments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eyevue-real-device-setup-audio-vision
          fetch-depth: 0
      - name: Scope attachment capability to current request
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/routes.ts')
          text = path.read_text()
          old = '''      const hasAttachmentContext = Boolean(attachmentContext) || providerBaseMessages.some((message) => (
                message.content.includes("<user_attachments>")
              ));'''
          new = '''      // Provider attachment capability belongs to the current submitted turn only.
              // Historical attachment context remains in conversation text for semantic follow-ups,
              // but must not force an unrelated later voice/text turn to require vision.
              const hasAttachmentContext = Boolean(attachmentContext);'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif 'const hasAttachmentContext = Boolean(attachmentContext);' not in text:
              raise SystemExit('Expected attachment-context routing block was not found')
          PY
      - name: Validate patch
        run: |
          git diff --check
          grep -F 'const hasAttachmentContext = Boolean(attachmentContext);' server/routes.ts
      - name: Commit patch
        run: |
          if git diff --quiet -- server/routes.ts; then
            echo 'Turn-isolation patch already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/routes.ts
          git commit -m 'Scope provider attachments to current turn'
          git push origin HEAD:fix/eyevue-real-device-setup-audio-vision