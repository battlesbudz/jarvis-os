name: PR 296 Codex blocker fixes

on:
  push:
    branches:
      - fix/eyevue-real-device-setup-audio-vision
    paths:
      - .github/workflows/pr296-codex-fixes.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eyevue-real-device-setup-audio-vision
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          component = Path('components/androidDaemon/AndroidDeviceControlCard.tsx')
          text = component.read_text()
          import_anchor = 'import { apiRequest, getApiUrl } from "@/lib/query-client";\n'
          helper_import = 'import { deriveEyeVueVoiceReadiness } from "@/lib/eyevue-setup";\n'
          if helper_import not in text:
              if import_anchor not in text:
                  raise SystemExit('component import anchor missing')
              text = text.replace(import_anchor, import_anchor + helper_import, 1)

          readiness_pattern = re.compile(
              r'  const nativeRecognitionReady = nativeSpeechStatus\?\.available === true && nativeSpeechStatus\?\.speechRecognitionAvailable !== false;\n'
              r'  const wearableVoiceReady = nativeRecognitionReady && nativeSpeechStatus\?\.wearableAudioAvailable === true;\n'
              r'  const wearableVoiceDetail = wearableVoiceReady\n'
              r'[\s\S]*?Native speech recognition must be available before wearable voice can be ready\.";'
          )
          readiness_replacement = '''  const eyeVueVoiceReadiness = deriveEyeVueVoiceReadiness({
            nativeSpeechAvailable: nativeSpeechStatus?.available,
            speechRecognitionAvailable: nativeSpeechStatus?.speechRecognitionAvailable,
            speechMessage: nativeSpeechStatus?.message,
            wearableAudioAvailable: nativeSpeechStatus?.wearableAudioAvailable,
            wearableAudioDeviceName: nativeSpeechStatus?.wearableAudioDeviceName,
            wearableAudioMessage: nativeSpeechStatus?.wearableAudioMessage,
            eyevueConnected: status?.eyevueConnected,
            eyevueDeviceName: status?.eyevueDeviceName,
          });
          const wearableVoiceReady = eyeVueVoiceReadiness.ready;
          const wearableVoiceDetail = eyeVueVoiceReadiness.detail;'''
          if 'deriveEyeVueVoiceReadiness({' not in text:
              text, count = readiness_pattern.subn(lambda _: readiness_replacement, text, count=1)
              if count != 1:
                  raise SystemExit('component readiness block missing')
          component.write_text(text)

          runner = Path('scripts/run-agent-tests.mjs')
          text = runner.read_text()
          anchor = '  { file: "lib/__tests__/authNavigation.test.ts" },\n'
          additions = [
              '  { file: "lib/__tests__/eyevueSetup.test.ts" },\n',
              '  { file: "server/agent/__tests__/coachContextTurnIsolation.test.ts" },\n',
          ]
          missing = [line for line in additions if line not in text]
          if missing:
              if anchor not in text:
                  raise SystemExit('test runner anchor missing')
              text = text.replace(anchor, ''.join(missing) + anchor, 1)
          runner.write_text(text)

          integration = Path('scripts/__tests__/eyevueIntegration.assert.mjs')
          text = integration.read_text()
          variable_anchor = 'const settings = read("components/androidDaemon/AndroidDeviceControlCard.tsx");\n'
          setup_var = 'const eyevueSetup = read("lib/eyevue-setup.ts");\n'
          if setup_var not in text:
              if variable_anchor not in text:
                  raise SystemExit('integration variable anchor missing')
              text = text.replace(variable_anchor, variable_anchor + setup_var, 1)

          settings_assert_pattern = re.compile(
              r'assert\.match\(settings, /nativeRecognitionReady[^\n]*\);\n'
              r'assert\.match\(settings, /wearableVoiceReady[^\n]*\);\n'
              r'assert\.match\(settings, /wearableVoiceDetail[^\n]*\);'
          )
          settings_assert_replacement = '''assert.match(settings, /deriveEyeVueVoiceReadiness\\(\\{/);
          assert.match(settings, /wearableAudioDeviceName: nativeSpeechStatus\\?\\.wearableAudioDeviceName/);
          assert.match(settings, /eyevueDeviceName: status\\?\\.eyevueDeviceName/);
          assert.match(eyevueSetup, /eyeVueAudioEndpointMatches[\\s\\S]*eyevue === audio/);
          assert.match(eyevueSetup, /ready =[\\s\\S]*wearableAudioAvailable === true[\\s\\S]*endpointMatches/);'''
          if 'assert.match(eyevueSetup, /eyeVueAudioEndpointMatches' not in text:
              text, count = settings_assert_pattern.subn(lambda _: settings_assert_replacement, text, count=1)
              if count != 1:
                  raise SystemExit('integration setup assertions missing')

          old_playback_assert = 'assert.match(playback, /cancelWearableRecoveryWait\\(\\)[\\s\\S]*WearableAudioRouteManager\\.release/);'
          new_playback_assert = '''assert.match(playback, /cancelWearableRouteCheck\\(\\)[\\s\\S]*WearableAudioRouteManager\\.release/);
          assert.match(playback, /if \\(!initialRoute\\.available\\)[\\s\\S]*ensureTts/);
          assert.match(playback, /monitorWearableRoute[\\s\\S]*!route\\.active[\\s\\S]*tts\\?\\.stop\\(\\)[\\s\\S]*waitForWearableRoute/);'''
          if old_playback_assert in text:
              text = text.replace(old_playback_assert, new_playback_assert, 1)
          integration.write_text(text)
          PY

          cp plugins/android-daemon-native/src/main/java/com/gameplan/daemon/NativeTalkModePlaybackBridge.kt \
             android/app/src/main/java/com/gameplan/daemon/NativeTalkModePlaybackBridge.kt

      - name: Install dependencies
        run: npm ci

      - name: Validate focused regressions
        run: |
          npm run jarvis:android-daemon:config-check
          node scripts/__tests__/eyevueIntegration.assert.mjs
          npx tsx lib/__tests__/eyevueSetup.test.ts
          npx tsx server/agent/__tests__/coachContextTurnIsolation.test.ts
          npx tsc --noEmit --pretty false
          git diff --check

      - name: Commit fixes and remove one-shot workflow
        run: |
          git rm .github/workflows/pr296-codex-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/androidDaemon/AndroidDeviceControlCard.tsx scripts/run-agent-tests.mjs scripts/__tests__/eyevueIntegration.assert.mjs android/app/src/main/java/com/gameplan/daemon/NativeTalkModePlaybackBridge.kt
          git commit -m 'Fix PR 296 Codex blockers'
          git push origin HEAD:fix/eyevue-real-device-setup-audio-vision
